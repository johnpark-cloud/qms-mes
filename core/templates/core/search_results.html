{% if results %}
<ul role="listbox" class="search-list">
{% for r in results %}<li role="option">{% if r.url %}<a href="{{ r.url }}"><strong>{{ r.label }}</strong> <span>{{ r.sub }}</span></a>{% else %}<strong>{{ r.label }}</strong> <span>{{ r.sub }}</span>{% endif %}</li>{% endfor %}
</ul>
{% elif q %}<p class="search-empty">검색 결과가 없습니다.</p>{% endif %}
