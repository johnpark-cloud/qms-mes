{% if user.is_authenticated and user.is_staff %}
<div class="qms-side">
  <button type="button" class="qms-side__toggle" aria-expanded="false" aria-controls="qms-sidebar">메뉴</button>
  <nav id="qms-sidebar" class="qms-sidebar" aria-label="주 메뉴">
    {% for g in nav_groups %}
    {% if g.name %}<h2>{{ g.name }}</h2>{% endif %}
    {% for l in g.links %}<a href="{{ l.url }}" {% if l.current %}aria-current="page"{% endif %}>{{ l.label }}</a>{% endfor %}
    {% endfor %}
  </nav>
</div>
{% endif %}
