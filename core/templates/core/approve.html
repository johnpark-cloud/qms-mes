{% extends "admin/base_site.html" %}
{% block content %}
<section class="card" style="max-width:40rem">
  <h2>{{ obj }}</h2>
  <p>승인 후에는 수정할 수 없고, 바꾸려면 새 개정을 만들어야 합니다.</p>
  {% if error %}<p class="errornote">{{ error }}</p>{% endif %}
  <form method="post" class="toolbar">{% csrf_token %}
    <label for="password">{{ request.user.username }} 비밀번호</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">승인</button>
    <a class="button ghost" href="{{ back }}">취소</a>
  </form>
</section>
{% endblock %}
